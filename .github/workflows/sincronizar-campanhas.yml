
name: Sincronizar campanhas de saude

on:
  workflow_dispatch:
    inputs:
      gravar:
        description: 'Gravar no Firestore (true/false)'
        type: boolean
        required: true
        default: false
      auto_aprovar:
        description: 'Permitir publicacao automatica de campanhas verificadas'
        type: boolean
        required: true
        default: false

  schedule:
    # 10:00 UTC = 07:00 em Fortaleza
    - cron: "0 10 * * *"

permissions:
  contents: read

concurrency:
  group: sincronizar-campanhas
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        working-directory: functions
        run: npm ci

      - name: Executar sincronizacao
        working-directory: functions
        env:
          GRAVAR_FIRESTORE: ${{ github.event_name == 'schedule' && vars.AGENDA_GRAVAR_AUTOMATICO == 'true' || github.event_name == 'workflow_dispatch' && inputs.gravar && 'true' || 'false' }}
          AUTO_APROVAR_CAMPANHAS: ${{ github.event_name == 'schedule' && vars.AGENDA_PUBLICAR_AUTOMATICO == 'true' || github.event_name == 'workflow_dispatch' && inputs.auto_aprovar && 'true' || 'false' }}
          IA_ATIVA: "true"
          GROQ_ANALISES_POR_EXECUCAO: "3"
          TAVILY_BUSCAS_POR_EXECUCAO: "2"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sincronizar-campanhas.cjs
